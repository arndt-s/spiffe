syntax = "proto3";

// The SPIFFE Workload Authorization Grant (WAG) Profile.
// See SPIFFE_WAG_Profile.md for the normative description of this service.
//
// Stability: Incubating.
package spiffe.wag.v1;

// WorkloadAuthorizationGrant is served on the SPIFFE Workload Endpoint,
// alongside (and independent of) the SPIFFE Workload API.
service WorkloadAuthorizationGrant {
    // Fetch Workload Authorization Grants for the calling workload, addressed
    // to the requested audience (an OAuth authorization server). If an
    // optional SPIFFE ID is requested, only the grant for that SPIFFE ID is
    // returned.
    //
    // The subject of every grant is the SPIFFE ID of the attested caller. It
    // is never taken from the request.
    rpc FetchWAG(FetchWAGRequest) returns (FetchWAGResponse);
}

// The FetchWAGRequest message conveys parameters for requesting Workload
// Authorization Grants. Field names follow the OAuth 2.0 Token Exchange
// request (RFC 8693, Section 2.1) where a parameter carries over.
message FetchWAGRequest {
    // Required. The issuer identifier (RFC 8414) of the authorization server
    // at which the workload will present the grant. Becomes the single value
    // of the grant's `aud` claim.
    string audience = 1;

    // Optional. A space-separated list of OAuth scopes (RFC 6749, Section
    // 3.3) the workload asks to have asserted in the grant's `scope` claim.
    string scope = 2;

    // Optional. If set, MUST be "urn:ietf:params:oauth:token-type:wag".
    string requested_token_type = 3;

    // Optional. The SPIFFE ID of the identity to request a grant for. If
    // unset, grants for all identities the workload is entitled to are
    // returned.
    string spiffe_id = 4;
}

// The FetchWAGResponse message conveys Workload Authorization Grants.
message FetchWAGResponse {
    // Required. One grant per returned identity. The first entry is the grant
    // for the default identity.
    repeated WAG grants = 1;
}

// The WAG message carries one Workload Authorization Grant and associated
// metadata. Field names follow the OAuth 2.0 Token Exchange response
// (RFC 8693, Section 2.2.1) where a parameter carries over.
message WAG {
    // Required. The SPIFFE ID of the workload. Equal to the grant's `sub`
    // claim.
    string spiffe_id = 1;

    // Required. The grant: a JWT using JWS Compact Serialization.
    bytes issued_token = 2;

    // Required. Always "urn:ietf:params:oauth:token-type:wag".
    string issued_token_type = 3;

    // Required. Expiration time of the grant, in seconds since the Unix epoch.
    // Equal to the grant's `exp` claim.
    int64 expires_at = 4;

    // Optional. The scopes asserted in the grant's `scope` claim, if any.
    string scope = 5;

    // Optional. An operator-specified string used to provide guidance on how
    // this identity should be used by a workload when more than one grant is
    // returned.
    string hint = 6;
}
